<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Artifact Bridge demo</title>
<!--
  Try-me artifact for Artifact Bridge. Fully self-contained: no external fonts,
  images or scripts. Every element sits inside a fixed-size #stage, which is what
  the ingester maps 1:1 to comp pixels. All motion settles within ~2 s, inside the
  default 2.6 s sampling window.
-->
<style>
  html, body { margin: 0; padding: 0; }
  #stage {
    position: relative;
    width: 1280px;
    height: 720px;
    background: #101014;
    overflow: hidden;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .abs { position: absolute; }

  /* rounded card with a border -> rect shape with roundness + stroke */
  #card {
    left: 140px; top: 150px; width: 1000px; height: 420px;
    border-radius: 28px;
    background: #1B1B22;
    border: 2px solid #3A3A48;
    opacity: 0;
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
  }
  /* circle that pops in -> ellipse shape with baked scale keys */
  #dot {
    left: 200px; top: 210px; width: 72px; height: 72px;
    border-radius: 50%;
    background: #C6FF3D;
    transform: scale(0);
    animation: pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
  }
  /* headline that slides up -> text layer with position + opacity keys */
  #title {
    left: 300px; top: 206px; margin: 0;
    color: #FFFFFF;
    font-size: 64px; font-weight: 700; letter-spacing: -1px;
    opacity: 0;
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
  }
  /* soft-wrapped paragraph -> one text layer per rendered line */
  #body {
    left: 200px; top: 320px; width: 560px; margin: 0;
    color: #B8B8C8;
    font-size: 28px; font-weight: 400; line-height: 1.4;
    opacity: 0;
    animation: fade 0.6s ease-out 0.7s forwards;
  }
  /* pill with its own label -> rect shape + text label on top */
  #pill {
    left: 200px; top: 470px; padding: 10px 22px;
    border-radius: 999px;
    background: #C6FF3D;
    color: #101014;
    font-size: 22px; font-weight: 700;
    opacity: 0;
    animation: fade 0.5s ease-out 1.0s forwards;
  }
  /* translucent fill -> solid colour + layer opacity */
  #glass {
    left: 820px; top: 210px; width: 260px; height: 160px;
    border-radius: 18px;
    background: rgba(198, 255, 61, 0.25);
    opacity: 0;
    animation: fade 0.6s ease-out 0.5s forwards;
  }
  /* gradient fill -> approximated by its first colour stop */
  #grad {
    left: 820px; top: 390px; width: 260px; height: 120px;
    border-radius: 18px;
    background: linear-gradient(90deg, #4F8CFF, #C6FF3D);
    opacity: 0;
    animation: fade 0.6s ease-out 0.6s forwards;
  }
  /* number that counts up (JS) -> sourceText hold keyframes */
  #count {
    left: 850px; top: 250px; margin: 0;
    color: #FFFFFF;
    font-size: 72px; font-weight: 700;
  }

  @keyframes rise {
    0%   { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes pop  { 0% { transform: scale(0); } 100% { transform: scale(1); } }
</style>
</head>
<body>
  <div id="stage">
    <div id="card" class="abs"></div>
    <div id="dot" class="abs"></div>
    <h1 id="title" class="abs">Hello, After Effects</h1>
    <p id="body" class="abs">This page was sampled in a headless browser and rebuilt as native, editable layers.</p>
    <div id="pill" class="abs">Editable</div>
    <div id="glass" class="abs"></div>
    <div id="grad" class="abs"></div>
    <p id="count" class="abs">0%</p>
  </div>
  <script>
    // count 0 -> 100 over ~1.2 s, starting at 0.5 s
    (function () {
      var el = document.getElementById('count');
      var t0 = null;
      function tick(now) {
        if (t0 === null) t0 = now;
        var k = Math.min(Math.max((now - t0 - 500) / 1200, 0), 1);
        el.textContent = Math.round(k * 100) + '%';
        if (k < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
